<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — الصفحة غير موجودة | Page Not Found</title>
<style>
  body { font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif; background: #07090d; color: #e8edf4; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 24px; box-sizing: border-box; }
  .box { max-width: 480px; background: #10151d; border: 1px solid #212b38; border-radius: 24px; padding: 40px 28px; box-shadow: 0 24px 48px -16px rgba(0,0,0,.65); }
  .code { font-size: 72px; font-weight: 900; margin: 0; background: linear-gradient(90deg, #2dd4bf, #fbbf24); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-size: 24px; margin: 12px 0 8px; }
  p { color: #93a3b8; margin: 6px 0; }
  a.btn { display: inline-block; margin-top: 20px; background: #0d9488; color: #f0fdfa; font-weight: 700; padding: 12px 28px; border-radius: 12px; text-decoration: none; }
  a.btn:hover { background: #0f766e; }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>هذه الصفحة غير موجودة</h1>
    <p>الرابط الذي طلبته غير متاح أو تغيّر مكانه.</p>
    <p dir="ltr">This page could not be found.</p>
    <a class="btn" href="/">العودة إلى الرئيسية</a>

</html>
